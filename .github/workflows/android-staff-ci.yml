name: Android Staff CI

on:
  push:
    branches:
      - main
    paths:
      - "android-staff/**"
      - ".github/workflows/android-staff-ci.yml"
  pull_request:
    paths:
      - "android-staff/**"
      - ".github/workflows/android-staff-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android-staff

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Gradle check
        run: ./gradlew --no-daemon check

      - name: Print Android lint report after Gradle check failure
        if: failure()
        run: |
          report="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
          if [ -f "$report" ]; then
            cat "$report"
          else
            echo "Android lint report not found at $report"
          fi

      - name: Android lint
        run: ./gradlew --no-daemon lintDebug

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hirmand-staff-debug-apk
          path: android-staff/app/build/outputs/apk/debug/app-debug.apk
