name: Android CI

# Monorepo: this workflow only runs when the Android project changes, so
# ordinary website commits do not pay for an Android build.
on:
  push:
    branches: ["main"]
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        # Every Gradle command runs inside the Android project root.
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      # The wrapper pins the Gradle version in gradle/wrapper/gradle-wrapper.properties,
      # so CI and a developer laptop run the exact same Gradle.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Gradle check
        run: ./gradlew --no-daemon check

      - name: Android lint
        run: ./gradlew --no-daemon lintDebug

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Node receiver syntax check
        run: node --check server/device-sync.mjs

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: hirmand-phone-bridge-debug
          # Artifact paths stay workspace-relative, so they carry the android/ prefix.
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hirmand-phone-bridge-reports
          path: |
            android/app/build/reports/**
            android/app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14

  emulator-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android instrumentation tests on Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          # The action runs its script from the workspace root and ignores the
          # job's working-directory, so the Gradle project is named explicitly.
          script: cd android && ./gradlew --no-daemon connectedDebugAndroidTest

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hirmand-phone-bridge-emulator-reports
          path: |
            android/app/build/reports/androidTests/**
            android/app/build/outputs/androidTest-results/**
          if-no-files-found: ignore
          retention-days: 14