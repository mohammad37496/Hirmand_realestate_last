name: Verify

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: hirmand-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # A cold runner can spend 10+ minutes in `playwright install --with-deps`
    # alone, and this job is timed including that. At 20 minutes the job was
    # cancelled mid-download before any project code ran, which reads as a
    # failure in the checks list but is only a slow install.
    timeout-minutes: 40
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hirmand_verify
      VITE_AUTH_ENABLED: "true"
      BROWSER_SMOKE_PROPERTY_ID: browser-smoke-property-001
      BROWSER_SMOKE_PROPERTY_SLUG: آپارتمان-تست-ناوبری-۱۴۰۵-browser-smoke
      BROWSER_SMOKE_PROPERTY_TITLE: فایل تست ناوبری جزئیات هیرمند
      REQUIRE_PROPERTY_SMOKE: "1"
      HIRMAND_ADMIN_KEY: browser-smoke-admin-key
      ADMIN_SMOKE_PROPERTY_TITLE: فایل تست mutation ادمین هیرمند
      ADMIN_SMOKE_PROPERTY_PRICE: "12345678901"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hirmand_verify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hirmand_verify"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify npm lockfile
        shell: bash
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if ! git diff --quiet -- package-lock.json; then
            echo "::error::package-lock.json is out of sync with package.json. Run npm install locally and commit the updated lockfile."
            git diff -- package-lock.json
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Provision checksum-verified FFmpeg runtime
        run: npm run prebuild
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Production build
        run: npm run build --ignore-scripts
      # `npm run build` no longer prunes devDependencies — that step moved to
      # `build:deploy`, which is what the runtime image uses. This reinstall is
      # kept as a cheap safety net in case the build command changes back, since
      # the browser smoke below needs Vite and Playwright.
      - name: Ensure CI dev dependencies after production build
        run: npm ci

      # The explicit provisioning step above installs the bundled FFmpeg binary
      # and Vazirmatn font into `.runtime/`. With those present the
      # watermark suite renders a real JPEG and a real video through the
      # production functions instead of skipping. This is the only job that can
      # prove FFmpeg still accepts the generated drawtext/overlay graph.
      - name: Watermark render regression (real FFmpeg)
        run: node --experimental-strip-types --test src/lib/property-watermark-render.test.ts

      # The smoke fixtures below write to and read from the real `properties`
      # table, so the service database has to be migrated first. Without this
      # the seed dies with `relation "properties" does not exist` and the
      # browser smoke never runs.
      - name: Apply database migrations
        id: migrate_database
        run: npm run db:migrate

      - name: Verify admin rate limiting across PostgreSQL sessions
        run: node --experimental-strip-types --test scripts/admin-rate-limit-postgres.test.mjs
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hirmand_verify

      - name: Verify customer chat cooldown locking across PostgreSQL sessions
        run: node --experimental-strip-types --test scripts/customer-chat-send-postgres.test.mjs
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hirmand_verify

      - name: Verify PostgreSQL server-side statement timeout
        run: node --experimental-strip-types --test scripts/db-statement-timeout-postgres.test.mjs
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hirmand_verify

      - name: Verify open-house RSVP locking across PostgreSQL sessions
        run: node --experimental-strip-types --test scripts/open-house-rsvp-postgres.test.mjs
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hirmand_verify

      - name: Verify customer submission review CAS across PostgreSQL sessions
        run: node --experimental-strip-types --test scripts/customer-submission-review-postgres.test.mjs
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hirmand_verify

      - name: Verify lead deduplication locking across PostgreSQL sessions
        run: node --experimental-strip-types --test src/lib/admin-lead-dedupe.test.ts
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hirmand_verify

      - name: Verify public lead intake deduplication across PostgreSQL sessions
        run: node --experimental-strip-types --test scripts/public-lead-phone-dedupe-postgres.test.mjs
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hirmand_verify

      - name: Verify public tracking and lead merge lock ordering across PostgreSQL sessions
        run: node --experimental-strip-types --test scripts/public-lead-tracking-merge-lock-postgres.test.mjs
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hirmand_verify

      - name: Verify deal and settlement lifecycle locking across PostgreSQL sessions
        run: node --experimental-strip-types --test scripts/admin-deal-lifecycle-postgres.test.mjs
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hirmand_verify

      - name: Verify overdue lead task deduplication across PostgreSQL sessions
        run: node --experimental-strip-types --test scripts/admin-overdue-task-postgres.test.mjs
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hirmand_verify

      - name: Seed deterministic property-detail fixture
        run: node scripts/seed-browser-smoke.mjs

      - name: Browser smoke against production preview
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /workspace
          sudo chown "$USER":"$USER" /workspace

          node scripts/password-reset-mail-mock.mjs > /tmp/hirmand-password-reset-mail-mock.log 2>&1 &
          MAIL_MOCK_PID=$!
          for attempt in {1..20}; do
            if curl --silent --fail http://127.0.0.1:4321/count >/dev/null; then break; fi
            sleep 0.5
          done

          BETTER_AUTH_URL=http://localhost:8081 \
          HIRMAND_TEST_ALLOW_IN_MEMORY_RATE_LIMIT=true \
          RESEND_API_URL=http://127.0.0.1:4321/emails \
          RESEND_API_KEY=ci-password-reset-test-key \
          RESEND_FROM_EMAIL='Hirmand <accounts@hirmandrealestate.ir>' \
            npx vite preview --host 127.0.0.1 --port 8081 > /tmp/hirmand-preview.log 2>&1 &
          PREVIEW_PID=$!

          cleanup() {
            status=$?
            kill "$PREVIEW_PID" >/dev/null 2>&1 || true
            wait "$PREVIEW_PID" >/dev/null 2>&1 || true
            kill "$MAIL_MOCK_PID" >/dev/null 2>&1 || true
            wait "$MAIL_MOCK_PID" >/dev/null 2>&1 || true
            if [ "$status" -ne 0 ]; then
              echo "::group::Vite preview log"
              cat /tmp/hirmand-preview.log || true
              echo "::endgroup::"
              echo "::group::Password-reset mail mock log"
              cat /tmp/hirmand-password-reset-mail-mock.log || true
              echo "::endgroup::"
            fi
            exit "$status"
          }
          trap cleanup EXIT

          for attempt in {1..45}; do
            if curl --silent --fail http://127.0.0.1:8081/ >/dev/null; then
              break
            fi
            if ! kill -0 "$PREVIEW_PID" >/dev/null 2>&1; then
              echo "::error::Vite preview exited before becoming ready."
              exit 1
            fi
            if [ "$attempt" -eq 45 ]; then
              echo "::error::Vite preview did not become ready on port 8081."
              exit 1
            fi
            sleep 1
          done

          # ubuntu-latest already ships Chrome/Chromium and their runtime
          # libraries. Install Playwright's pinned browser without invoking
          # apt, then launch it explicitly so missing shared libraries fail
          # here rather than halfway through the browser smoke suite.
          npx playwright install chromium
          node scripts/playwright-runtime-smoke.mjs
          # Exercise natural-language mode selection, first-page pagination,
          # and geolocated nearby results against an isolated seeded PGlite DB.
          node scripts/public-search-browser-harness.test.mjs
          # Run the isolated PGlite gallery fixture across real phone/tablet
          # viewports. Keep its responsive screenshots with the other Verify
          # artifacts instead of writing into the repository checkout.
          GALLERY_SCREENSHOT_DIR=/workspace/screenshots/gallery-landscape node scripts/property-gallery-landscape-browser.test.mjs
          curl --silent --fail http://127.0.0.1:8081/ >/dev/null
          # Exercise real Better Auth sessions and per-account workspace
          # isolation against this job's disposable PostgreSQL service.
          CUSTOMER_AUTH_SMOKE_URL=http://localhost:8081 node scripts/customer-auth-e2e-smoke.mjs
          # Exercise the complete recovery and password-change lifecycle using
          # a loopback-only Resend mock; no external email is ever sent.
          PASSWORD_RESET_SMOKE_URL=http://localhost:8081 node scripts/password-reset-e2e-smoke.mjs
          node scripts/music-player-browser.test.mjs http://127.0.0.1:8081
          # End-to-end proof of the admin upload path: begin → chunks → complete.
          # Anonymous reads must return 404; the authenticated same-origin read
          # must return the original JPEG with private,no-store. This also guards
          # the FFmpeg watermark filter regression that returned HTTP 500 on uploads.
          node scripts/upload-e2e-smoke.mjs http://127.0.0.1:8081
          # Run the responsive matrix first so failures in unrelated route,
          # search, or admin smoke tests cannot prevent mobile diagnostics.
          node scripts/responsive-layout-smoke.mjs http://127.0.0.1:8081
          # Assert equal compact list-card geometry and real non-overlap with
          # the fixed mobile action dock at five narrow-phone viewports.
          node scripts/property-list-mobile-footer-overlap.browser.test.mjs http://127.0.0.1:8081
          # Compare every rendered list card across content variants (long title,
          # missing image, absent metadata, rental price lines) at phone/tablet widths.
          node scripts/property-list-mobile-uniform.browser.test.mjs http://127.0.0.1:8081
          node scripts/browser-smoke.mjs http://127.0.0.1:8081/ /workspace/screenshots/hirmand-preview.png
          node scripts/property-search-browser-smoke.mjs http://127.0.0.1:8081
          node scripts/admin-mutation-smoke.mjs http://127.0.0.1:8081

      - name: Cleanup property-detail fixture
        if: always() && steps.migrate_database.outcome == 'success'
        run: node scripts/seed-browser-smoke.mjs --cleanup

      - name: Upload browser smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hirmand-browser-smoke
          path: /workspace/screenshots
          if-no-files-found: warn
