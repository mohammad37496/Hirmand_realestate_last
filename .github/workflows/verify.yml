name: Verify

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: hirmand-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # A cold runner can spend 10+ minutes in `playwright install --with-deps`
    # alone, and this job is timed including that. At 20 minutes the job was
    # cancelled mid-download before any project code ran, which reads as a
    # failure in the checks list but is only a slow install.
    timeout-minutes: 40
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hirmand_verify
      BROWSER_SMOKE_PROPERTY_ID: browser-smoke-property-001
      BROWSER_SMOKE_PROPERTY_SLUG: آپارتمان-تست-ناوبری-۱۴۰۵-browser-smoke
      BROWSER_SMOKE_PROPERTY_TITLE: فایل تست ناوبری جزئیات هیرمند
      REQUIRE_PROPERTY_SMOKE: "1"
      HIRMAND_ADMIN_KEY: browser-smoke-admin-key
      ADMIN_SMOKE_PROPERTY_TITLE: فایل تست mutation ادمین هیرمند
      ADMIN_SMOKE_PROPERTY_PRICE: "12345678901"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hirmand_verify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hirmand_verify"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify npm lockfile
        shell: bash
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if ! git diff --quiet -- package-lock.json; then
            echo "::error::package-lock.json is out of sync with package.json. Run npm install locally and commit the updated lockfile."
            git diff -- package-lock.json
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      # `npm run build` no longer prunes devDependencies — that step moved to
      # `build:deploy`, which is what the runtime image uses. This reinstall is
      # kept as a cheap safety net in case the build command changes back, since
      # the browser smoke below needs Vite and Playwright.
      - name: Ensure CI dev dependencies after production build
        run: npm ci

      # `npm run build` explicitly runs the deploy validator, which provisions
      # the bundled FFmpeg binary and Vazirmatn font into `.runtime/` on Linux.
      # With those present the watermark suite renders a real JPEG and video
      # through the production functions instead of skipping.
      - name: Watermark render regression (real FFmpeg)
        run: node --experimental-strip-types --test src/lib/property-watermark-render.test.ts

      # The smoke fixtures below write to and read from the real `properties`
      # table, so the service database has to be migrated first. Without this
      # the seed dies with `relation "properties" does not exist` and the
      # browser smoke never runs.
      - name: Apply database migrations
        id: migrate_database
        run: npm run db:migrate

      - name: Media cleanup PostgreSQL integration
        run: npm run test:media-cleanup:postgres

      - name: Database API PostgreSQL integration
        run: npm run test:database-api:postgres

      - name: Property lifecycle PostgreSQL integration
        run: npm run test:property-lifecycle:postgres

      - name: Seed deterministic property-detail fixture
        run: node scripts/seed-browser-smoke.mjs

      - name: Browser smoke against built Nitro server
        shell: bash
        env:
          NODE_ENV: production
          PORT: "8081"
          NITRO_PORT: "8081"
          HOST: 127.0.0.1
          NITRO_HOST: 127.0.0.1
          QA_BASE_URL: http://127.0.0.1:8081
          QA_VIEWPORTS: "320x568,360x800,390x844,412x915,768x1024,1024x768,1440x900,1920x1080"
          QA_SCREENSHOT_DIR: /workspace/screenshots/admin
          HIRMAND_ADMIN_KEY: browser-smoke-admin-key
          PHONE_BRIDGE_PAIRING_TOKEN: ""
          HIRMAND_PHONE_BRIDGE_TOKEN: ""
          PHONE_BRIDGE_SYNC_TOKEN: ""
        run: |
          set -euo pipefail
          sudo mkdir -p /workspace
          sudo chown "$USER":"$USER" /workspace

          # Run the actual built server used by Liara, not Vite's development
          # preview. This also tests runtime FFmpeg/font path resolution from
          # the Nitro bundle and the real request handlers.
          node .output/server/index.mjs > /tmp/hirmand-nitro.log 2>&1 &
          SERVER_PID=$!

          cleanup() {
            status=$?
            kill "$SERVER_PID" >/dev/null 2>&1 || true
            wait "$SERVER_PID" >/dev/null 2>&1 || true
            if [ "$status" -ne 0 ]; then
              echo "::group::Built Nitro server log"
              cat /tmp/hirmand-nitro.log || true
              echo "::endgroup::"
            fi
            exit "$status"
          }
          trap cleanup EXIT

          for attempt in {1..45}; do
            if curl --silent --fail http://127.0.0.1:8081/ >/dev/null; then
              break
            fi
            if ! kill -0 "$SERVER_PID" >/dev/null 2>&1; then
              echo "::error::Built Nitro server exited before becoming ready."
              exit 1
            fi
            if [ "$attempt" -eq 45 ]; then
              echo "::error::Built Nitro server did not become ready on port 8081."
              exit 1
            fi
            sleep 1
          done

          npx playwright install --with-deps chromium
          # Verify the property detail page against real local fixtures and
          # an isolated migrated PGlite database, including the sticky mobile
          # contact CTA at phone and tablet widths.
          npm run test:property-card-browser
          curl --silent --fail http://127.0.0.1:8081/ >/dev/null
          node scripts/phone-bridge-e2e.mjs http://127.0.0.1:8081
          # End-to-end proof of the admin upload path: begin → chunks → complete,
          # then fetch served bytes and verify the watermark-on/watermark-off
          # paths against the same built runtime that runs in production.
          node scripts/upload-e2e-smoke.mjs http://127.0.0.1:8081
          # Run the responsive matrix first so failures in unrelated route,
          # search, or admin smoke tests cannot prevent mobile diagnostics.
          node scripts/responsive-layout-smoke.mjs http://127.0.0.1:8081
          node scripts/browser-smoke.mjs http://127.0.0.1:8081/ /workspace/screenshots/hirmand-preview.png
          node scripts/property-search-browser-smoke.mjs http://127.0.0.1:8081
          node scripts/admin-mutation-smoke.mjs http://127.0.0.1:8081
          node scripts/admin-business-workflows-e2e.mjs http://127.0.0.1:8081
          # Keep the server alive while auditing admin layouts and accessibility.
          npm run qa:admin-a11y

      - name: Cleanup property-detail fixture
        if: always() && steps.migrate_database.outcome == 'success'
        run: node scripts/seed-browser-smoke.mjs --cleanup

      - name: Upload browser smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hirmand-browser-smoke
          path: /workspace/screenshots
          if-no-files-found: warn
