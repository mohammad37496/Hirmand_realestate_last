name: Synchronize source repository to destination
# Trigger a one-time synchronization for the property map redesign.
# Triggered once to apply the latest verified neighborhood catalog.

on:
  # Poll the source repository so ordinary source commits are mirrored
  # even though a workflow in another repository cannot trigger this one
  # without a separately configured webhook/token.
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/migrate-source.yml"

permissions:
  contents: write

concurrency:
  group: hirmand-source-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          repository: mohammad37496/Hirmand_real_Estate
          ref: main
          path: .source-repo

      - name: Mirror source files while preserving destination workflows
        shell: bash
        run: |
          set -euo pipefail
          test -d .source-repo/src
          test -f .source-repo/package.json

          # Keep destination-specific deployment/sync workflows intact.
          # Exclude the source checkout itself from rsync's --delete set.
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.source-repo/' \
            .source-repo/ ./

          test -f package.json
          test -d src
          rm -rf .source-repo
          git status --short

      - name: Stage source changes, including source-tracked ignored assets
        shell: bash
        run: |
          set -euo pipefail
          git add -A

          # These source assets are intentionally covered by .gitignore,
          # so force-add them to ensure the mirror is actually complete.
          if [[ -d public/images/fallback ]]; then
            git add -f public/images/fallback/
          fi
          if [[ -d artifacts/imagine_images ]]; then
            git add -f artifacts/imagine_images/
          fi

      - name: Commit and push changes when needed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --cached --quiet; then
            echo "Destination is already synchronized with source main."
            exit 0
          fi

          git commit -m "chore: synchronize project from source repository"
          git push origin HEAD:main
