name: Synchronize source repository to destination
# One-time sync for the property-card smoke selector fix.
# One-time sync for the latest property map redesign.
# Trigger a one-time synchronization for the property map redesign.
# Triggered once to apply the latest verified neighborhood catalog.

on:
  # The upstream source repository is archived; never overwrite main automatically.
  # Manual dispatch requires an explicit confirmation before a one-time sync.
  workflow_dispatch:
    inputs:
      confirm_source_sync:
        description: "Confirm that replacing destination files from the archived source is intentional."
        type: boolean
        required: true
        default: false

permissions:
  actions: write
  contents: write

concurrency:
  group: hirmand-source-sync
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ inputs.confirm_source_sync == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          repository: mohammad37496/Hirmand_real_Estate
          ref: main
          path: .source-repo

      - name: Mirror source files while preserving destination workflows
        shell: bash
        run: |
          set -euo pipefail
          test -d .source-repo/src
          test -f .source-repo/package.json

          # Keep destination-specific deployment/sync workflows intact.
          # Exclude the source checkout itself from rsync's --delete set.
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.source-repo/' \
            .source-repo/ ./

          test -f package.json
          test -d src
          rm -rf .source-repo
          git status --short

      - name: Stage source changes, including source-tracked ignored assets
        shell: bash
        run: |
          set -euo pipefail
          git add -A

          # These source assets are intentionally covered by .gitignore,
          # so force-add them to ensure the mirror is actually complete.
          if [[ -d public/images/fallback ]]; then
            git add -f public/images/fallback/
          fi
          if [[ -d artifacts/imagine_images ]]; then
            git add -f artifacts/imagine_images/
          fi

      - name: Commit and push changes when needed
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --cached --quiet; then
            echo "Destination is already synchronized with source main."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore: synchronize project from source repository"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger CI, browser verification, and deployment for the mirrored revision
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run ci.yml --ref main
          gh workflow run verify.yml --ref main
          gh workflow run deploy-liara.yml --ref main
