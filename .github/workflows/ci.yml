name: CI
# Homepage refactor verification trigger
# Final homepage hierarchy pass verification

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hirmand_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hirmand_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Run the real watermark-render tests with the same verified FFmpeg and
      # Persian font required by Liara. Without this step the render suite sees
      # missing assets and skips its image/video integration checks.
      - name: Provision watermark runtime for render tests
        run: node scripts/ensure-ffmpeg.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Install Chromium for viewport interaction tests
        run: npx playwright install --with-deps chromium

      - name: Music player browser regression
        run: npm run test:music-player-browser

      # Applies every migration and then executes the Phone Bridge write
      # statements against a real Postgres. This is the only check that can
      # catch a parameter-typing or conflict-target regression, which is how
      # this project has broken before.
      - name: Phone Bridge schema and SQL
        run: npm run test:phone-bridge:sql

      - name: Production build
        run: npm run build
        env:
          VITE_SITE_URL: https://www.hirmandrealestate.ir
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hirmand_ci
