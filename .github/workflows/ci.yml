name: CI
# Homepage refactor verification trigger
# Final homepage hierarchy pass verification

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hirmand_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hirmand_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Run the real watermark-render tests with the same verified FFmpeg and
      # Persian font required by Liara. Without this step the render suite sees
      # missing assets and skips its image/video integration checks.
      - name: Provision watermark runtime for render tests
        run: node scripts/ensure-ffmpeg.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Install Chromium for viewport interaction tests
        run: npx playwright install --with-deps chromium

      - name: Music player browser regression
        run: npm run test:music-player-browser

      # Applies every migration and then executes the Phone Bridge write
      # statements against a real Postgres. This is the only check that can
      # catch a parameter-typing or conflict-target regression, which is how
      # this project has broken before.
      - name: Phone Bridge schema and SQL
        run: npm run test:phone-bridge:sql

      - name: Production build
        run: npm run build
        env:
          VITE_SITE_URL: https://www.hirmandrealestate.ir
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hirmand_ci

      - name: Migrate PostgreSQL for database integration smoke tests
        run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hirmand_ci

      - name: Media cleanup PostgreSQL integration
        run: npm run test:media-cleanup:postgres
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hirmand_ci

      - name: Database API PostgreSQL integration
        run: npm run test:database-api:postgres
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hirmand_ci

      - name: Property lifecycle PostgreSQL integration
        run: npm run test:property-lifecycle:postgres
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hirmand_ci

      - name: Phone Bridge HTTP authentication smoke
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hirmand_ci
          PORT: "8082"
          NITRO_PORT: "8082"
          HOST: 127.0.0.1
          NITRO_HOST: 127.0.0.1
          PHONE_BRIDGE_PAIRING_TOKEN: ""
          HIRMAND_PHONE_BRIDGE_TOKEN: ""
          PHONE_BRIDGE_SYNC_TOKEN: ""
        run: |
          set -euo pipefail
          node .output/server/index.mjs > /tmp/hirmand-phone-bridge-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=0
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8082/api/device-sync/v1/update >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            cat /tmp/hirmand-phone-bridge-http.log
            exit 1
          fi

          node scripts/phone-bridge-e2e.mjs http://127.0.0.1:8082
