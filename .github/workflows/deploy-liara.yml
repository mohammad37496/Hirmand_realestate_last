name: Deploy to Liara
# Re-deploy the fully synchronized main tree after source asset migration.
# Deployment trigger: keep Liara in sync with the latest main commit.

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Only the newest main commit should be deployed.
concurrency:
  group: liara-deploy-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ !contains(github.event.head_commit.message, 'trigger neighborhood catalog sync') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Liara CLI
        run: npm i -g @liara/cli@9

      - name: Deploy
        env:
          LIARA_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
          LIARA_TEAM_ID: ${{ secrets.LIARA_TEAM_ID }}
          LIARA_APP_NAME: ${{ vars.LIARA_APP_NAME }}
          http_proxy: http://proxy.liara.ir:6666
          https_proxy: http://proxy.liara.ir:6666
        shell: bash
        run: |
          set -euo pipefail
          APP_NAME="${LIARA_APP_NAME:-hirmand}"
          if [[ -z "${LIARA_TOKEN:-}" ]]; then
            echo "::error::GitHub Actions secret LIARA_API_TOKEN is empty or unavailable."
            exit 1
          fi
          TEAM_ARGS=()
          if [[ -n "${LIARA_TEAM_ID:-}" ]]; then
            TEAM_ARGS+=(--team-id="${LIARA_TEAM_ID}")
          fi

          set +e
          timeout --signal=TERM --kill-after=30s 35m liara deploy \
            --app="${APP_NAME}" \
            --api-token="${LIARA_TOKEN}" \
            "${TEAM_ARGS[@]}" \
            --build-location="germany" \
            --port="3000" \
            --no-app-logs \
            --message="Deploy ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}" \
            --debug
          DEPLOY_STATUS=$?
          set -e
          if [[ "${DEPLOY_STATUS}" -eq 124 ]]; then
            echo "::error::Liara CLI did not finish within 35 minutes. The last CLI phase above distinguishes source upload/fetch from remote build/runtime output; the failure hook will collect bounded diagnostics."
          fi
          exit "${DEPLOY_STATUS}"

      - name: Verify public production routes after release
        timeout-minutes: 5
        run: node scripts/live-site-smoke.mjs https://hirmandrealestate.ir

      # Opt-in collection prevents routine deployments from copying general
      # application logs to GitHub. A commit containing [diagnose-upload] enables
      # this one-time, narrowly filtered snapshot for the current incident.
      - name: Capture upload-related Liara runtime diagnostics
        if: contains(github.event.head_commit.message, '[diagnose-upload]')
        continue-on-error: true
        timeout-minutes: 2
        env:
          LIARA_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
          LIARA_TEAM_ID: ${{ secrets.LIARA_TEAM_ID }}
          LIARA_APP_NAME: ${{ vars.LIARA_APP_NAME }}
        shell: bash
        run: |
          set -uo pipefail
          APP_NAME="${LIARA_APP_NAME:-hirmand}"
          TEAM_ARGS=()
          if [[ -n "${LIARA_TEAM_ID:-}" ]]; then
            TEAM_ARGS+=(--team-id="${LIARA_TEAM_ID}")
          fi
          liara app logs \
            --app="${APP_NAME}" \
            --api-token="${LIARA_TOKEN}" \
            "${TEAM_ARGS[@]}" \
            --timestamps \
            --last-lines \
            --since="24 hours ago" 2>&1 |
            grep -E -i '\[upload\]|\[media\]|\[property-media\]|\[liara-storage\]|\[prestart\]|\[migrate\]|\[db\]|\[font\]|\[ffmpeg\]' || true

      - name: Diagnose Liara runtime on failure
        if: failure()
        continue-on-error: true
        timeout-minutes: 2
        env:
          LIARA_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
          LIARA_TEAM_ID: ${{ secrets.LIARA_TEAM_ID }}
          LIARA_APP_NAME: ${{ vars.LIARA_APP_NAME }}
        shell: bash
        run: |
          set -euo pipefail
          APP_NAME="${LIARA_APP_NAME:-hirmand}"
          TEAM_ARGS=()
          if [[ -n "${LIARA_TEAM_ID:-}" ]]; then
            TEAM_ARGS+=(--team-id="${LIARA_TEAM_ID}")
          fi
          liara app logs \
            --app="${APP_NAME}" \
            --api-token="${LIARA_TOKEN}" \
            "${TEAM_ARGS[@]}" \
            --timestamps \
            --last-lines \
            --since="30 minutes ago"
