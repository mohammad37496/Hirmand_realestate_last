name: Deploy to Liara
# Re-deploy the fully synchronized main tree after source asset migration.
# Deployment trigger: keep Liara in sync with the latest main commit.

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Only the newest main commit should be deployed.
concurrency:
  group: liara-deploy-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ !contains(github.event.head_commit.message, 'trigger neighborhood catalog sync') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js for runtime asset provisioning
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deploy tooling dependencies
        timeout-minutes: 10
        run: npm ci

      - name: Provision checksum-verified FFmpeg runtime on GitHub runner
        timeout-minutes: 15
        env:
          HIRMAND_FFMPEG_DOWNLOAD_TIMEOUT_MS: 120000
        shell: bash
        run: |
          set -euo pipefail
          npm run prebuild
          test -x .runtime/ffmpeg/ffmpeg
          test -s .runtime/fonts/Vazirmatn-Regular.ttf
          test -x src/.runtime/ffmpeg/ffmpeg
          test -x src/lib/.runtime/ffmpeg/ffmpeg
          .runtime/ffmpeg/ffmpeg -hide_banner -version

      - name: Install Liara CLI
        run: npm i -g @liara/cli@9
      - name: Validate required customer account environment before deployment
        env:
          LIARA_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
          LIARA_TEAM_ID: ${{ secrets.LIARA_TEAM_ID }}
          LIARA_APP_NAME: ${{ vars.LIARA_APP_NAME }}
        shell: bash
        run: |
          set -euo pipefail
          APP_NAME="${LIARA_APP_NAME:-hirmand}"
          if [[ -z "${LIARA_TOKEN:-}" ]]; then
            echo "::error::GitHub Actions secret LIARA_API_TOKEN is empty or unavailable."
            exit 1
          fi
          TEAM_ARGS=()
          if [[ -n "${LIARA_TEAM_ID:-}" ]]; then
            TEAM_ARGS+=(--team-id="${LIARA_TEAM_ID}")
          fi
          liara env list \
            --app="${APP_NAME}" \
            --api-token="${LIARA_TOKEN}" \
            "${TEAM_ARGS[@]}" \
            --output=json > "${RUNNER_TEMP}/liara-env.json"
          node scripts/validate-liara-auth-env.mjs "${RUNNER_TEMP}/liara-env.json"
      - name: Stamp deployment revision
        env:
          DEPLOYMENT_SHA: ${{ github.sha }}
          DEPLOYMENT_BRANCH: ${{ github.ref_name }}
          DEPLOYMENT_RUN_ID: ${{ github.run_id }}
        run: node scripts/write-deployment-info.mjs

      - name: Deploy
        timeout-minutes: 60
        env:
          LIARA_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
          LIARA_TEAM_ID: ${{ secrets.LIARA_TEAM_ID }}
          LIARA_APP_NAME: ${{ vars.LIARA_APP_NAME }}
          http_proxy: http://proxy.liara.ir:6666
          https_proxy: http://proxy.liara.ir:6666
        shell: bash
        run: |
          set -euo pipefail
          APP_NAME="${LIARA_APP_NAME:-hirmand}"
          if [[ -z "${LIARA_TOKEN:-}" ]]; then
            echo "::error::GitHub Actions secret LIARA_API_TOKEN is empty or unavailable."
            exit 1
          fi
          TEAM_ARGS=()
          if [[ -n "${LIARA_TEAM_ID:-}" ]]; then
            TEAM_ARGS+=(--team-id="${LIARA_TEAM_ID}")
          fi

          liara deploy \
            --app="${APP_NAME}" \
            --api-token="${LIARA_TOKEN}" \
            "${TEAM_ARGS[@]}" \
            --build-location="germany" \
            --port="3000" \
            --no-app-logs \
            --message="Deploy ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}" \
            --debug

      - name: Verify customer-auth migrations in Liara runtime logs
        timeout-minutes: 3
        env:
          LIARA_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
          LIARA_TEAM_ID: ${{ secrets.LIARA_TEAM_ID }}
          LIARA_APP_NAME: ${{ vars.LIARA_APP_NAME }}
          EXPECTED_DEPLOYMENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          APP_NAME="${LIARA_APP_NAME:-hirmand}"
          EXPECTED_LINE="[migrate] customer-auth migrations verified for deployment ${EXPECTED_DEPLOYMENT_SHA}: 0001_auth.sql, 0058_customer_workspace.sql"
          TEAM_ARGS=()
          if [[ -n "${LIARA_TEAM_ID:-}" ]]; then
            TEAM_ARGS+=(--team-id="${LIARA_TEAM_ID}")
          fi
          for attempt in {1..12}; do
            LOG_OUTPUT="$(liara app logs \
              --app="${APP_NAME}" \
              --api-token="${LIARA_TOKEN}" \
              "${TEAM_ARGS[@]}" \
              --timestamps \
              --last-lines \
              --since="15 minutes ago" 2>/dev/null || true)"
            if grep -Fq "${EXPECTED_LINE}" <<<"${LOG_OUTPUT}"; then
              echo "Customer-auth migration ledger verified for deployment ${EXPECTED_DEPLOYMENT_SHA}."
              exit 0
            fi
            if [[ "${attempt}" -lt 12 ]]; then
              sleep 10
            fi
          done
          echo "::error::Liara runtime logs did not report customer-auth migration verification for deployment ${EXPECTED_DEPLOYMENT_SHA} within 12 attempts."
          exit 1

      - name: Verify live Liara release matches this commit
        id: live_release_verify
        continue-on-error: true
        timeout-minutes: 5
        env:
          EXPECTED_DEPLOYMENT_SHA: ${{ github.sha }}
          LIARA_PUBLIC_URL: https://hirmandrealestate.ir
        run: node scripts/verify-live-deployment.mjs

      - name: Verify the reported Liara gallery image through the public media proxy
        id: liara_gallery_image_verify
        continue-on-error: true
        timeout-minutes: 2
        env:
          LIARA_PUBLIC_URL: https://hirmandrealestate.ir
        run: node scripts/verify-liara-gallery-object.mjs

      - name: Install live browser smoke dependencies
        timeout-minutes: 12
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Verify live property experience in a real browser
        id: live_browser_smoke
        timeout-minutes: 20
        env:
          RESPONSIVE_SCREENSHOT_DIR: ${{ runner.temp }}/hirmand-live-responsive
        run: node scripts/responsive-layout-smoke.mjs https://hirmandrealestate.ir

      - name: Upload live responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hirmand-live-responsive-${{ github.run_id }}
          path: ${{ runner.temp }}/hirmand-live-responsive
          if-no-files-found: ignore
          retention-days: 7

      - name: Enforce live release and browser verification
        if: always()
        env:
          LIVE_RELEASE_OUTCOME: ${{ steps.live_release_verify.outcome }}
          LIVE_BROWSER_OUTCOME: ${{ steps.live_browser_smoke.outcome }}
          LIARA_GALLERY_IMAGE_OUTCOME: ${{ steps.liara_gallery_image_verify.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${LIVE_RELEASE_OUTCOME}" != "success" ]]; then
            echo "::error::Live release SHA/assets verification did not succeed."
            exit 1
          fi
          if [[ "${LIVE_BROWSER_OUTCOME}" != "success" ]]; then
            echo "::error::Live responsive browser verification did not succeed."
            exit 1
          fi
          if [[ "${LIARA_GALLERY_IMAGE_OUTCOME}" != "success" ]]; then
            echo "::error::The reported Liara gallery object did not load as a valid image through the public media proxy."
            exit 1
          fi

      # Opt-in collection prevents routine deployments from copying general
      # application logs to GitHub. A commit containing [diagnose-upload] enables
      # this one-time, narrowly filtered snapshot for the current incident.
      - name: Capture upload-related Liara runtime diagnostics
        if: contains(github.event.head_commit.message, '[diagnose-upload]')
        continue-on-error: true
        timeout-minutes: 2
        env:
          LIARA_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
          LIARA_TEAM_ID: ${{ secrets.LIARA_TEAM_ID }}
          LIARA_APP_NAME: ${{ vars.LIARA_APP_NAME }}
        shell: bash
        run: |
          set -uo pipefail
          APP_NAME="${LIARA_APP_NAME:-hirmand}"
          TEAM_ARGS=()
          if [[ -n "${LIARA_TEAM_ID:-}" ]]; then
            TEAM_ARGS+=(--team-id="${LIARA_TEAM_ID}")
          fi
          liara app logs \
            --app="${APP_NAME}" \
            --api-token="${LIARA_TOKEN}" \
            "${TEAM_ARGS[@]}" \
            --timestamps \
            --last-lines \
            --since="24 hours ago" 2>&1 |
            grep -E -i '\[upload\]|\[media\]|\[liara-storage\]|\[prestart\]|\[migrate\]|\[db\]|\[font\]|\[ffmpeg\]' || true

      - name: Diagnose Liara runtime on failure
        if: failure()
        continue-on-error: true
        timeout-minutes: 2
        env:
          LIARA_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
          LIARA_TEAM_ID: ${{ secrets.LIARA_TEAM_ID }}
          LIARA_APP_NAME: ${{ vars.LIARA_APP_NAME }}
        shell: bash
        run: |
          set -euo pipefail
          APP_NAME="${LIARA_APP_NAME:-hirmand}"
          TEAM_ARGS=()
          if [[ -n "${LIARA_TEAM_ID:-}" ]]; then
            TEAM_ARGS+=(--team-id="${LIARA_TEAM_ID}")
          fi
          liara app logs \
            --app="${APP_NAME}" \
            --api-token="${LIARA_TOKEN}" \
            "${TEAM_ARGS[@]}" \
            --timestamps \
            --last-lines \
            --since="30 minutes ago"
