name: Materialize local property fallback photos

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/materialize-fallback-photos.yml"
      - "scripts/fallback-source-images.json"
      - "scripts/generate-fallback-assets.mjs"

permissions:
  contents: write

concurrency:
  group: materialize-fallback-photos
  cancel-in-progress: false

jobs:
  download-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download source photos into the repository
        run: node scripts/generate-fallback-assets.mjs

      - name: Verify every local gallery photo
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, statSync } from "node:fs";
          import { join } from "node:path";

          const manifest = JSON.parse(readFileSync("scripts/fallback-source-images.json", "utf8"));
          const root = "public/images/fallback";
          const missing = [];
          for (const [type, urls] of Object.entries(manifest)) {
            for (let index = 0; index < urls.length; index += 1) {
              const number = String(index + 1).padStart(2, "0");
              const path = join(root, `${type}-${number}.jpg`);
              try {
                const size = statSync(path).size;
                const bytes = readFileSync(path).subarray(0, 12);
                const jpeg = bytes[0] === 0xff && bytes[1] === 0xd8 && bytes[2] === 0xff;
                const webp = bytes.toString("ascii", 8, 12) === "WEBP";
                const png = bytes[0] === 0x89 && bytes.toString("ascii", 1, 4) === "PNG";
                if (size <= 1024 || !(jpeg || webp || png)) missing.push(path);
              } catch {
                missing.push(path);
              }
            }
          }
          if (missing.length) {
            console.error("Missing or invalid local property photos:");
            for (const path of missing) console.error(" - " + path);
            process.exit(1);
          }
          console.log("All " + Object.values(manifest).reduce((sum, list) => sum + list.length, 0) + " local property photos are present.");
          NODE

      - name: Commit vendored images
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f public/images/fallback/*.jpg
          if git diff --cached --quiet; then
            echo "Fallback photos are already committed."
            exit 0
          fi
          git commit -m "Store real property fallback photos in repository"
          git push origin HEAD:main
