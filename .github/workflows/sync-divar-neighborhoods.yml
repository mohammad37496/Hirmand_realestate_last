name: Sync Divar Isfahan neighborhood geometry

on:
  workflow_dispatch:
  schedule:
    - cron: "23 1 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/sync-divar-neighborhoods.mjs"
      - ".github/workflows/sync-divar-neighborhoods.yml"

permissions:
  contents: write

concurrency:
  group: divar-neighborhood-catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch and validate Divar catalog
        run: node scripts/sync-divar-neighborhoods.mjs
      - name: Commit changed snapshot
        run: |
          if git diff --quiet -- data/divar-isfahan-neighborhoods.json; then
            echo "The authoritative Divar snapshot is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/divar-isfahan-neighborhoods.json
          git commit -m "chore: sync Divar Isfahan neighborhood geometry"
          git push
