      <rect x="725" y="260" width="245" height="185" rx="8" fill="#6fb1a9"/>
      <path d="M120 570h940" stroke="#c9ad73" stroke-width="12" stroke-linecap="round"/>
      <rect x="185" y="485" width="805" height="60" rx="12" fill="#c8b99e"/>
      <g fill="#4f6c61"><circle cx="180" cy="600" r="28"/><circle cx="1010" cy="600" r="31"/></g>
    
