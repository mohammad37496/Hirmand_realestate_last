<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">ملک تجاری</title>
  <desc id="desc">تصویر پیش‌فرض حرفه‌ای برای فایل‌های تجاری</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0f171c"/>
      <stop offset=".55" stop-color="#1e3438"/>
      <stop offset="1" stop-color="#49685f"/>
    </linearGradient>
    <radialGradient id="sun" cx=".78" cy=".18" r=".55">
      <stop stop-color="#fff4d8" stop-opacity=".92"/>
      <stop offset=".45" stop-color="#d8c18d" stop-opacity=".16"/>
      <stop offset="1" stop-color="#d8c18d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fff" stop-opacity=".09"/>
      <stop offset="1" stop-color="#000" stop-opacity=".16"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#071014" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <rect width="1200" height="760" fill="url(#sun)"/>
  <circle cx="160" cy="125" r="90" fill="#f5ecd7" opacity=".045"/>
  <circle cx="1015" cy="670" r="220" fill="#84b9a8" opacity=".08"/>
  <g filter="url(#shadow)">
    
      <rect x="120" y="170" width="940" height="400" rx="22" fill="#e8e4dc"/>
      <rect x="160" y="215" width="860" height="300" rx="14" fill="#202e35"/>
